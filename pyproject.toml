[project]
name = "sharelatex-tools"
version = "0.1.0"
description = "Tools to ShareLaTeX projects into git repos."
authors = [
    {name = "Jeffrey McGovern",email = "jeff@jdmcg.org"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
loguru = "^0.7.3"
click = "^8.4.2"
pydantic-settings = "^2.15.0"
pyoverleaf = {git = "git@github.com:jmcgover/pyoverleaf.git"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "rust-just (>=1.58.0,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "ruff (>=0.16.2,<0.17.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pylsp-mypy (>=0.8.0,<0.9.0)",
    "pyclean (>=3.7.0,<4.0.0)",
    "bandit (>=1.9.4,<2.0.0)"
]
